<!-- Cleaned Role-Aware Dashboard Sidebar Navigation Component -->
<nav class="sidebar-nav-menu d-flex flex-column gap-3">
    <!-- Group: Principal -->
    <div class="app-nav-group">
        <span class="app-nav-group-title">Mi Cuenta</span>
        <a href="{% url 'accounts:dashboard' %}" class="app-sidebar-link sidebar-nav-item {% if active_tab == 'dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'accounts:profile' %}" class="app-sidebar-link sidebar-nav-item {% if active_tab == 'profile' %}active{% endif %}">
            <i class="bi bi-person-badge"></i>
            <span>Mi Perfil</span>
        </a>
    </div>

    <!-- Group: Actividad & Comunidad -->
    <div class="app-nav-group">
        <span class="app-nav-group-title">Comunidad</span>
        <a href="{% url 'accounts:dashboard_reviews' %}" class="app-sidebar-link sidebar-nav-item {% if active_tab == 'reviews' %}active{% endif %}">
            <i class="bi bi-star-fill text-warning"></i>
            <span>Opiniones</span>
        </a>
        <a href="{% url 'accounts:dashboard_discussions' %}" class="app-sidebar-link sidebar-nav-item {% if active_tab == 'discussions' %}active{% endif %}">
            <i class="bi bi-chat-left-text-fill text-info"></i>
            <span>Debates</span>
        </a>
    </div>

    <!-- Group: Creador (Only for Authors) -->
    {% if user.profile.role == 'author' %}
        <div class="app-nav-group">
            <span class="app-nav-group-title">Taller Creativo</span>
            <a href="{% url 'novels:author_dashboard' %}" class="app-sidebar-link sidebar-nav-item {% if active_tab == 'workshop' or request.resolver_match.app_name == 'novels' %}active{% endif %}">
                <i class="bi bi-feather text-warning"></i>
                <span>Mi Taller de Escritor</span>
            </a>
        </div>
    {% endif %}
</nav>
